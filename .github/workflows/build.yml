name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pyinstaller pillow

      - name: Icone
        run: python tools/make_icon.py

      - name: Executable
        run: pyinstaller NPUScribe.spec --noconfirm

      - name: Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Installateur
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
                  Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe introuvable apres installation d'Inno Setup" }
          Write-Host "ISCC : $($iscc.FullName)"
          # Le nom de version vient du tag pour une release, sinon 0.1.0.
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.1.0" }
          & $iscc.FullName "/DAppVersion=$version" installer\npuscribe.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC a echoue (code $LASTEXITCODE)" }

      - name: Verifications
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist_installer\*.exe | Select-Object -First 1
          if (-not $setup) { throw "aucun installateur produit" }
          "Installateur : $($setup.Name) — $([math]::Round($setup.Length/1MB,1)) Mo"
          $exe = "dist\NPUScribe\NPUScribe.exe"
          if (-not (Test-Path $exe)) { throw "executable absent" }
          "Executable : $([math]::Round((Get-Item $exe).Length/1MB,1)) Mo"

      # L'installateur est l'artefact principal : c'est lui qu'on telecharge.
      # GitHub l'emballe toujours dans un zip, c'est impose par l'API.
      - uses: actions/upload-artifact@v4
        with:
          name: NPUScribe-Setup-windows-x64
          path: dist_installer/*.exe
          if-no-files-found: error
          retention-days: 90

      - name: Publication (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist_installer/*.exe
          generate_release_notes: true
